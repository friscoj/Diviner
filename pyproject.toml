[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diviner"
version = "0.1.0"
description = "Live Kronos forecasts fed by TradingView Desktop"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "friscoj", email = "jamie.frisco@gmail.com" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.0.0",
  "einops>=0.8.0",
  "huggingface_hub>=0.33.0",
  "safetensors>=0.4.0",
  "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["diviner*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
